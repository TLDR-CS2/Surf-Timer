// SurfTimer standard Surf ruleset.
// Sources: CS2Surf/Timer server settings and cs2-surf-cfg-dumper's
// accepted mapper template. Map-specific overrides are executed last.

// Movement
sv_gravity 800
sv_airaccelerate 150
sv_friction 5.2
sv_accelerate 10
sv_maxspeed 350
sv_maxvelocity 3500
// SurfTimer uses 2000 as the global noclip ceiling and applies each player's
// selected 500-2000 u/s practice limit independently.
sv_noclipspeed 2000
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_staminajumpcost 0
sv_staminalandcost 0
sv_falldamage_scale 0

// Continuous Surf rounds
sv_hibernate_when_empty 0
mp_timelimit 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_freezetime 0
mp_team_intro_time 0
mp_round_restart_delay 0
mp_ignore_round_win_conditions 1
mp_warmuptime 0
mp_warmuptime_all_players_connected 0
mp_warmup_end

// Players and teams
mp_humanteam ct
mp_spectators_max 64
mp_limitteams 0
mp_autoteambalance 0
mp_solid_teammates 0
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_friendlyfire 0
mp_suicide_penalty 0
mp_drop_knife_enable 1
mp_weapons_allow_map_placed 1
bot_quota 0

// Communication and quality of life
sv_alltalk 1
sv_deadtalk 1
sv_disable_radar 1
sv_allow_votes 0

// Start-LocalServer.ps1 selects and writes this map-specific override.
exec surftimer/maps/active-map.cfg
